name: Generate Stats Images

on:
  push:
    branches: 
      - master
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2 tag
      with:
        version: 0.16.0

    - name: Build
      run: |
        zig build

    - name: Checkout history branch
      run: |
        git config --global user.name "jstrieb/github-stats"
        git config --global user.email "github-stats[bot]@jstrieb.github.io"
        # Push generated files to the generated branch
        git pull
        git checkout generated || git checkout -b generated

    - name: Generate images
      run: |
        ./zig-out/bin/github-stats
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        # Forks (upstream history not authored here) plus generated/notes
        # repos, excluded so the stats reflect actually-authored work.
        EXCLUDE_REPOS: "seanthimons/EPATADA,seanthimons/EJAM-open,seanthimons/PODUAM,seanthimons/hermes-agent,seanthimons/538_data,seanthimons/harmonize-wq,seanthimons/OHM-g,seanthimons/camcorder,seanthimons/toxvaldbstage,seanthimons/THREAT,seanthimons/ccte__chem_expo_data_mgmt_scripts,seanthimons/toxvaldbmain,seanthimons/mirai,seanthimons/claude-buddy,seanthimons/standartox,seanthimons/30DayMapChallenge,seanthimons/PRISMA-Checklist,seanthimons/get-shit-done,seanthimons/apipkgen,seanthimons/bsicons,seanthimons/data-science,seanthimons/chemical-janitor,seanthimons/autonewsmd,seanthimons/skills,seanthimons/machine-proverbs,seanthimons/obsidian-vault,seanthimons/settings,seanthimons/github-stats"
        EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS }}
        EXCLUDE_PRIVATE: "false"
        SILENT: "true"
        # TODO: Remove this when they get their API working again
        # https://github.com/orgs/community/discussions/192970
        MAX_RETRIES: 5

    - name: Commit to the repo
      run: |
        git add .
        # Force the build to succeed, even if no files were changed
        git commit -m 'Update generated files' || true
        git push --set-upstream origin generated
